name: Build & Deploy Public Wiki

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: wiki-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build site
        run: zensical build --strict

      # Replaces hooks/cache_bust.py, because Zensical doesn't run MkDocs hooks (tcs-docs#318).
      # A new ?v= on every deploy makes Cloudflare fetch fresh copies of our own CSS and JS.
      # The grep fails the build if the home page didn't get it.
      - name: Cache-bust our CSS and JS
        run: |
          v="${GITHUB_SHA::8}"
          find site -name '*.html' -print0 | xargs -0 sed -i -E "s#(javascripts/animations\.js|stylesheets/deep-space\.css)\"#\1?v=${v}\"#g"
          grep -q "deep-space.css?v=${v}" site/index.html

      - name: Upload artifact
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: mkdocs-site
          path: site/
          retention-days: 3

      # tcs-discord#10 rollout — alert #🔴-workflow-errors on any preceding step failure.
      - uses: ./.github/actions/notify-discord-on-failure
        if: failure()
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_WORKFLOW_ERRORS }}

  deploy-vps:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    # tcs-docs#252: TCS_WIKI_DEPLOY_KEY is kept in the `vps` environment, which
    # only `main` may use, so no other branch's run can read it.
    environment: vps
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: mkdocs-site
          path: site/

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.TCS_WIKI_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Add host to known_hosts
        run: ssh-keyscan -H 51.195.43.156 >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        # The remote path is empty because rrsync -wo /var/www/tcs-wiki/site is set as
        # forced command on ubuntu authorized_keys line for this ed25519 key.
        run: |
          rsync -av --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            site/ ubuntu@51.195.43.156:.

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

      # tcs-discord#10 rollout — alert #🔴-workflow-errors on any preceding step failure.
      - uses: ./.github/actions/notify-discord-on-failure
        if: failure()
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_WORKFLOW_ERRORS }}
